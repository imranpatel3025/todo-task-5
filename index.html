<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 4</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

    <h2 class="text-center mb-4 bg-success text-white p-3">Todo Task Using LocalStorage</h2>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center bg-warning">
                        TODO FORM
                    </div>
                    <div class="card-body">
                        <form id="todoListForm">
                        <div class="form-group">
                           
                            <input required type="text" class="form-control" placeholder="Enter Todo..." id="formControl">
                        </div>
                        <button class="btn btn-block btn-dark btn-sm" id="addBtn">Add Todo</button>
                        <button type="button" class="btn btn-block btn-primary btn-sm d-none" id="updateBtn">Update Todo</button>
                    </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="text-center">Todo List</h4>
                    </div>
                    <div class="card-body" id="todoList">                        
                        <ul class="list-group" id="listContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between align-items-center">
                                <h4><strong>Todo 1</strong></h4>
                              <div>  
                                <button class="btn btn-warning btn-sm">Edit</button>
                                <button class="btn btn-danger btn-sm">Delete</button>
                            </div>
                            </li>                            -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
